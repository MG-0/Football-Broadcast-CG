<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Follow Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Outfit:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        background: #060b17;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 40px;
        overflow-x: hidden;
      }

      /* Animated background blobs */
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        z-index: 0;
        animation: blobFloat 8s ease-in-out infinite alternate;
      }
      body::before {
        width: 400px;
        height: 400px;
        background: #6366f1;
        top: -100px;
        left: -100px;
      }
      body::after {
        width: 350px;
        height: 350px;
        background: #8b5cf6;
        bottom: -80px;
        right: -80px;
        animation-delay: 2s;
      }
      @keyframes blobFloat {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(30px, 20px) scale(1.05);
        }
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      /* Card */
      .card {
        width: 100%;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        overflow: hidden;
        box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5);
        animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Top gradient bar */
      .top-bar {
        height: 4px;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899, #f59e0b);
        background-size: 200% 100%;
        animation: gradientShift 4s linear infinite;
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 0%;
        }
        100% {
          background-position: 200% 0%;
        }
      }

      .card-body {
        padding: 32px 28px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      /* Badge */
      .badge {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #6366f1;
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(99, 102, 241, 0.25);
        padding: 4px 12px;
        border-radius: 99px;
      }

      .title {
        font-family: "Outfit", sans-serif;
        font-size: 26px;
        font-weight: 900;
        color: #f8fafc;
        text-align: center;
        line-height: 1.2;
        letter-spacing: -0.5px;
        animation: fadeUp 0.6s 0.15s both;
      }
      .subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #94a3b8;
        text-align: center;
        line-height: 1.5;
        margin-top: 6px;
        animation: fadeUp 0.6s 0.2s both;
      }
      .title-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        width: 100%;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Divider */
      .divider {
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Links list */
      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .link-btn {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        text-decoration: none;
        color: #e2e8f0;
        font-size: 14px;
        font-weight: 700;
        transition: all 0.2s ease;
        cursor: pointer;
        animation: fadeUp 0.5s both;
      }
      .link-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .link-btn:active {
        transform: translateY(0);
      }

      .link-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .link-text {
        flex: 1;
      }
      .link-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.5;
        margin-bottom: 1px;
      }
      .link-value {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }

      .link-arrow {
        opacity: 0.3;
        font-size: 14px;
      }

      /* Colors per platform */
      .icon-website {
        background: rgba(99, 102, 241, 0.18);
      }
      .icon-instagram {
        background: rgba(225, 48, 108, 0.18);
      }
      .icon-facebook {
        background: rgba(24, 119, 242, 0.18);
      }
      .icon-youtube {
        background: rgba(255, 0, 0, 0.18);
      }
      .icon-x {
        background: rgba(255, 255, 255, 0.08);
      }

      /* Footer */
      .footer {
        font-size: 10px;
        color: #334155;
        text-align: center;
        font-weight: 500;
        letter-spacing: 0.5px;
        padding-top: 4px;
      }

      /* Loading / Error states */
      .state-msg {
        color: #475569;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        padding: 40px 0;
      }

      /* Responsive adjustments */
      @media (max-width: 480px) {
        .card-body {
          padding: 24px 20px 20px;
        }
        .title {
          font-size: 22px;
        }
        .link-btn {
          padding: 12px 14px;
          gap: 10px;
        }
        .link-value {
          max-width: 160px;
          font-size: 12px;
        }
        .link-icon {
          width: 34px;
          height: 34px;
          font-size: 16px;
        }
      }

      @media (max-width: 360px) {
        .card-body {
          padding: 20px 16px 16px;
        }
        .title {
          font-size: 20px;
        }
        .link-value {
          max-width: 130px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="top-bar"></div>
        <div class="card-body" id="card-body">
          <p class="state-msg">Loading...</p>
        </div>
      </div>
      <p
        class="footer"
        id="footer-text"
        style="margin-top: 16px; opacity: 0"
      ></p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const matchId = params.get("id");
      // Use the same host/port that served this page — works on localhost AND on LAN IP
      const API_BASE =
        window.location.origin
          .replace(/\/overlay-live.*/, "")
          .replace("file://", "http://localhost:5000") ||
        "http://localhost:5000";

      const PLATFORMS = [
        { key: "website", label: "Website", emoji: "🌐", cls: "icon-website" },
        {
          key: "instagram",
          label: "Instagram",
          emoji: "📸",
          cls: "icon-instagram",
        },
        {
          key: "facebook",
          label: "Facebook",
          emoji: "📘",
          cls: "icon-facebook",
        },
        { key: "youtube", label: "YouTube", emoji: "▶️", cls: "icon-youtube" },
        { key: "x", label: "X", emoji: "✖️", cls: "icon-x" },
      ];

      async function load() {
        const body = document.getElementById("card-body");
        const footer = document.getElementById("footer-text");

        if (!matchId) {
          body.innerHTML = `<p class="state-msg">❌ No match ID provided.</p>`;
          return;
        }

        try {
          const res = await fetch(
            `${API_BASE}/routes/matches/${matchId}/qr-code/data`,
            {
              headers: { "ngrok-skip-browser-warning": "true" },
            },
          );
          const data = await res.json();
          const qr = data.qrCode || {};

          // Build links list
          const activeLinks = PLATFORMS.filter((p) => qr[p.key]);

          let delay = 0.1;
          const linksHTML = activeLinks
            .map((p) => {
              const url = qr[p.key].startsWith("http")
                ? qr[p.key]
                : `https://${qr[p.key]}`;
              delay += 0.07;
              return `
          <a class="link-btn" href="${url}" target="_blank" rel="noopener" style="animation-delay:${delay.toFixed(2)}s">
            <div class="link-icon ${p.cls}">${p.emoji}</div>
            <div class="link-text">
              <div class="link-label">${p.label}</div>
              <div class="link-value">${qr[p.key]}</div>
            </div>
            <span class="link-arrow">→</span>
          </a>`;
            })
            .join("");

          body.innerHTML = `
        <div class="badge" style="animation:fadeUp 0.5s 0.05s both">LIVE BROADCAST</div>
        <div class="title-wrapper">
          <p class="title">${qr.titleQr || "Follow Us"}</p>
          ${qr.subTitleQr ? `<p class="subtitle">${qr.subTitleQr}</p>` : ""}
        </div>
        ${activeLinks.length ? `<div class="divider"></div><div class="links">${linksHTML}</div>` : `<p class="state-msg" style="padding:16px 0">No links added yet.</p>`}
      `;

          // Footer with match info
          if (data.homeTeam || data.awayTeam) {
            footer.textContent = `${data.homeTeam?.shortName || ""} vs ${data.awayTeam?.shortName || ""}`;
            footer.style.opacity = "1";
          }
        } catch (err) {
          body.innerHTML = `<p class="state-msg">⚠️ Could not load data. Make sure the server is running.</p>`;
          console.error(err);
        }
      }

      load();
    </script>
  </body>
</html>
